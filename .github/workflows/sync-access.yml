name: Sync lesson access to Supabase
on:
  push:
    branches: [main]
    paths: [supabase/artifact_access_seed.sql]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync_access.py
        env:
          SUPABASE_URL: https://ejywlpscqvchwifnlevx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
