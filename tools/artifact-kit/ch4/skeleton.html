<style>
.txin{font:600 1.05rem var(--mono);padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:min(100%,420px)}
.lab{font:700 .7rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.out{font:600 1rem var(--mono);padding:10px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line);min-height:46px;white-space:pre-wrap;word-break:break-word}
.out.bad{color:var(--bad)}.out.good{color:var(--good)}
.ch{display:grid;gap:8px;margin:10px 0}
.ch button{text-align:left;font:600 .95rem var(--sans);padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ch button:hover{border-color:var(--accent)}
.ch button.ok{border-color:var(--good);background:var(--good-soft)}.ch button.no{border-color:var(--bad);background:var(--bad-soft)}
.code{font:500 .95rem/1.7 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 0;overflow-x:auto}
.code .ln{display:block;padding:0 14px;white-space:pre}
.code .ln.on{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.code .ln.err{background:var(--bad-soft);box-shadow:inset 4px 0 0 var(--bad)}
.code .ln.done{opacity:.55}
.cm{color:var(--muted)}.kwd{color:var(--n);font-weight:700}.str{color:var(--bad)}.num{color:var(--k)}
.sqr{display:inline-block;min-width:34px;padding:6px 4px;border:1.5px solid var(--line);border-radius:6px;text-align:center;font:600 .8rem var(--mono);background:var(--surface);margin:2px}
.blocks{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.blk{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font:700 .74rem var(--mono);color:#fff;border:1.5px solid var(--line);background:var(--soft)}
.blk.e{color:var(--muted)}
.dg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.log{font:500 .88rem/1.5 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:80px;max-height:240px;overflow:auto}
.log div{padding:1px 0}.log .hi{color:var(--accent);font-weight:700}.log .bd{color:var(--bad);font-weight:700}.log .gd{color:var(--good);font-weight:700}
table.reg{border-collapse:collapse;font:600 .9rem var(--mono)}
table.reg td,table.reg th{border:1px solid var(--line);padding:5px 12px;text-align:center}
table.reg th{background:var(--soft);font:700 .7rem var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mem input{width:76px;font:600 .95rem var(--mono);padding:4px 6px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
</style>
<div class="wrap">
<header class="top">
  <div class="eyebrow">IGCSE Computer Science · 0478 · Chapter 4 · @@SEC@@</div>
  <h1>@@TITLE@@</h1>
  <p class="lead">@@LEAD@@</p>
</header>
<nav class="tablist" role="tablist" aria-label="Sections">
  <button role="tab" data-p="learn">Learn</button>
  <button role="tab" data-p="watch">Watch</button>
  <button role="tab" data-p="explore">Explore</button>
  <button role="tab" data-p="practise">Practise</button>
  <button role="tab" data-p="real">Real world</button>
  <button role="tab" data-p="exam">Exam questions</button>
  <button role="tab" data-p="tips">Tips &amp; keywords</button>
</nav>

@@LEARN@@
</section>
